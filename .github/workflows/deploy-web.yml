name: Deploy Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3
  GODOT_RELEASE: 4.3-stable
  GODOT_BIN: godot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Godot and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "${base_url}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            --output /tmp/templates.tpz \
            "${base_url}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "/usr/local/bin/${GODOT_BIN}"
          mkdir -p "/tmp/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Stamp development build
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          sed -i "s/const BUILD_COMMIT := \"local\"/const BUILD_COMMIT := \"${short_sha}\"/" web/build_info.gd

      - name: Import and validate Godot project
        run: godot --headless --path . --editor --import --quit

      - name: Export Web Preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web Preview" build/web/index.html

      - name: Validate Web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          find build/web -maxdepth 1 -type f -name '*.js' -size +0c | grep -q .
          find build/web -maxdepth 1 -type f -name '*.wasm' -size +0c | grep -q .
          find build/web -maxdepth 1 -type f -name '*.pck' -size +0c | grep -q .
          ! grep -q '\$GODOT_' build/web/index.html
          touch build/web/.nojekyll
          find build/web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


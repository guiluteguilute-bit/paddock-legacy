name: Deploy Web Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3
  GODOT_RELEASE: 4.3-stable
  GODOT_BIN: ${{ github.workspace }}/.tools/godot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Godot and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "${base_url}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            --output /tmp/templates.tpz \
            "${base_url}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "${GITHUB_WORKSPACE}/.tools"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "${GODOT_BIN}"
          mkdir -p "/tmp/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          "${GODOT_BIN}" --version

      - name: Diagnose and validate Web export configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Installed export templates:"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          python3 tests/validate_web_export.py --templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Build, test, and validate Web artifact
        shell: bash
        env:
          BUILD_ENVIRONMENT: production
        run: ./scripts/ci_web.sh

      - name: Upload Godot debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-debug-logs
          path: build/logs/*.log
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

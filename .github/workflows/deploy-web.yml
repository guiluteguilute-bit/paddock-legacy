name: Deploy Web Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3
  GODOT_RELEASE: 4.3-stable
  GODOT_BIN: ${{ github.workspace }}/.tools/godot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Godot and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "${base_url}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            --output /tmp/templates.tpz \
            "${base_url}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "${GITHUB_WORKSPACE}/.tools"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "${GODOT_BIN}"
          mkdir -p "/tmp/templates" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          "${GODOT_BIN}" --version

      - name: Stamp development build
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          sed -i "s/const BUILD_COMMIT := \"local\"/const BUILD_COMMIT := \"${short_sha}\"/" web/build_info.gd

      - name: Validate project data
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validate_project.py

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m "${GODOT_BIN}" --headless --path . --editor --import --quit

      - name: Run Godot core tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m "${GODOT_BIN}" --headless --path . tests/godot/test_core.tscn

      - name: Load main scene headlessly
        shell: bash
        run: |
          set -euo pipefail
          timeout 2m "${GODOT_BIN}" --headless --path . --quit-after 2

      - name: Export Web Preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          timeout 10m "${GODOT_BIN}" --headless --path . --export-release "Web Preview" build/web/index.html

      - name: Validate Web artifact
        shell: bash
        run: |
          set -euo pipefail
          touch build/web/.nojekyll
          python3 tests/validate_web_build.py build/web
          find build/web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

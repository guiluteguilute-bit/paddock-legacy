<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560"><title>Career facilities journey</title><desc>Early, middle and late career visual promise.</desc><rect width="1440" height="560" fill="#101820"/><text x="720" y="48" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="28" font-weight="700">ONE KART → ONE TEAM → ONE WORLD-CLASS ORGANIZATION</text><g transform="translate(25 80)"><rect width="445" height="420" rx="14" fill="#263442"/><image href="../progression/facility_level_1.svg" x="8" y="8" width="429" height="300"/><text x="222" y="340" text-anchor="middle" fill="#24b6a6" font-family="sans-serif" font-size="20" font-weight="700">EARLY CAREER</text><text x="222" y="373" text-anchor="middle" fill="#dce5e8" font-family="sans-serif" font-size="12">ONE DRIVER · ONE KART · ONE GARAGE</text></g><g transform="translate(500 80)"><rect width="445" height="420" rx="14" fill="#263442"/><image href="../progression/facility_level_3.svg" x="8" y="8" width="429" height="300"/><text x="222" y="340" text-anchor="middle" fill="#24b6a6" font-family="sans-serif" font-size="20" font-weight="700">MID CAREER</text><text x="222" y="373" text-anchor="middle" fill="#dce5e8" font-family="sans-serif" font-size="12">PROFESSIONAL RACING TEAM</text></g><g transform="translate(975 80)"><rect width="445" height="420" rx="14" fill="#263442"/><image href="../progression/facility_level_5.svg" x="8" y="8" width="429" height="300"/><text x="222" y="340" text-anchor="middle" fill="#24b6a6" font-family="sans-serif" font-size="20" font-weight="700">LATE CAREER</text><text x="222" y="373" text-anchor="middle" fill="#dce5e8" font-family="sans-serif" font-size="12">FORMULA APEX WORLD CAMPUS</text></g></svg>
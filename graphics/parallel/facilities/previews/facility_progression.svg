<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460"><title>Facility progression levels one to five</title><desc>Side-by-side mobile-readable progression from kart garage to world campus.</desc><rect width="1600" height="460" fill="#101820"/><text x="40" y="45" fill="#f7faf9" font-family="sans-serif" font-size="26" font-weight="700">BUILD FROM NOTHING. COMPETE WITH THE WORLD.</text><g transform="translate(20 75)"><rect width="300" height="330" rx="10" fill="#263442"/><image href="../progression/facility_level_1.svg" x="5" y="5" width="290" height="260"/><text x="150" y="294" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17" font-weight="700">LEVEL 1</text><rect x="35" y="310" width="46" height="7" rx="3" fill="#24b6a6"/></g><g transform="translate(336 75)"><rect width="300" height="330" rx="10" fill="#263442"/><image href="../progression/facility_level_2.svg" x="5" y="5" width="290" height="260"/><text x="150" y="294" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17" font-weight="700">LEVEL 2</text><rect x="35" y="310" width="92" height="7" rx="3" fill="#24b6a6"/></g><g transform="translate(652 75)"><rect width="300" height="330" rx="10" fill="#263442"/><image href="../progression/facility_level_3.svg" x="5" y="5" width="290" height="260"/><text x="150" y="294" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17" font-weight="700">LEVEL 3</text><rect x="35" y="310" width="138" height="7" rx="3" fill="#24b6a6"/></g><g transform="translate(968 75)"><rect width="300" height="330" rx="10" fill="#263442"/><image href="../progression/facility_level_4.svg" x="5" y="5" width="290" height="260"/><text x="150" y="294" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="17" font-weight="700">LEVEL 4</text><rect x="35" y="310" width="184" height="7" rx="3" fill="#24b6a6"/></g><g transform="translate(1284 75)"><rect width="300" height="330" rx="10" fill="#263442
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#111a25"/><stop offset="1" stop-color="#05080d"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#17212a"/><stop offset="1" stop-color="#070a0e"/></linearGradient>
    <linearGradient id="cyan" x2="1"><stop stop-color="#80fff0"/><stop offset=".45" stop-color="#13cbbd"/><stop offset="1" stop-color="#08796f"/></linearGradient>
    <linearGradient id="paint" x2="0" y2="1"><stop stop-color="#35e9da"/><stop offset=".45" stop-color="#119b92"/><stop offset="1" stop-color="#063c3b"/></linearGradient>
    <linearGradient id="rubber" x2="0" y2="1"><stop stop-color="#30363b"/><stop offset=".5" stop-color="#090b0e"/><stop offset="1"/></linearGradient>
    <radialGradient id="lamp"><stop stop-color="#dffffb" stop-opacity=".9"/><stop offset="1" stop-color="#35d9c8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9adbd4" stroke-opacity=".055"/></pattern>
    <pattern id="floorgrain" width="23" height="17" patternUnits="userSpaceOnUse"><path d="M2 4h1m8 7h2m7-8h1M5 15h2" stroke="#d8eeec" stroke-opacity=".09"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>

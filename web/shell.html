<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#090e17">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; background: #090e17; }
    body { color: #f5f7fa; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overscroll-behavior: none; }
    #canvas { display: block; width: 100%; height: 100%; outline: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
    #canvas:focus { outline: 0; }
    #status { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; background: radial-gradient(circle at 50% 45%, #111f2d, #090e17 60%); transition: opacity .25s ease; }
    #status.hidden { opacity: 0; pointer-events: none; }
    #status-title { margin: 0; color: #f5f7fa; font-size: clamp(28px, 6vw, 52px); font-style: italic; letter-spacing: .12em; }
    #status-text { margin: 0; color: #18d3c5; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; }
    #progress { width: min(66vw, 360px); height: 4px; overflow: hidden; border: 0; border-radius: 4px; background: #233245; color: #18d3c5; }
    #progress::-webkit-progress-bar { background: #233245; }
    #progress::-webkit-progress-value { background: #18d3c5; }
    #progress::-moz-progress-bar { background: #18d3c5; }
    #status-error { display: none; max-width: min(80vw, 560px); margin: 0; color: #ff6b71; white-space: pre-wrap; }
    #retry { display: none; padding: 14px 24px; border: 1px solid #18d3c5; border-radius: 8px; background: #10232c; color: #f5f7fa; font-weight: 700; }
  </style>
</head>
<body>
  <canvas id="canvas">Votre navigateur ne prend pas en charge Canvas.</canvas>
  <div id="status" role="status" aria-live="polite">
    <h1 id="status-title">PADDOCK LEGACY</h1>
    <p id="status-text">Chargement…</p>
    <progress id="progress" max="1" value="0"></progress>
    <p id="status-error"></p>
    <button id="retry" type="button">RÉESSAYER</button>
  </div>
  <noscript>JavaScript doit être activé pour lancer Paddock Legacy.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    const engine = new Engine($GODOT_CONFIG);
    const status = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const statusError = document.getElementById('status-error');
    const progress = document.getElementById('progress');
    const retry = document.getElementById('retry');
    retry.addEventListener('click', () => window.location.reload());

    engine.startGame({
      onProgress(current, total) {
        if (total > 0) progress.value = current / total;
      }
    }).then(() => {
      status.classList.add('hidden');
      window.setTimeout(() => status.remove(), 300);
    }).catch((error) => {
      progress.style.display = 'none';
      statusText.textContent = 'Le lancement a échoué';
      statusError.style.display = 'block';
      retry.style.display = 'inline-block';
      statusError.textContent = error instanceof Error ? error.message : String(error);
      console.error(error);
    });
  </script>
</body>
</html>

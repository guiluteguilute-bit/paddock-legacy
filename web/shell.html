<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#090e17">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    :root { --app-height: 100vh; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #020912; }
    body { height: 100vh; color: #f5f7fa; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    /* Godot owns the single in-game safe area. Do not apply the iPhone insets a
       second time around the canvas. */
    #game { position: fixed; top: var(--app-top, 0px); right: 0; bottom: auto; left: 0; box-sizing: border-box; width: 100%; height: var(--app-height); overflow: hidden; }
    #canvas { display: block; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; outline: 0; overflow: hidden; }
    #canvas:focus { outline: 0; }
    @supports (height: 100dvh) {
      :root { --app-height: 100dvh; }
      body, #game { height: 100dvh; }
    }
    #status { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; background: radial-gradient(circle at 50% 45%, #111f2d, #090e17 60%); transition: opacity .25s ease; }
    #status.hidden { opacity: 0; pointer-events: none; }
    #status-title { margin: 0; color: #f5f7fa; font-size: clamp(28px, 6vw, 52px); font-style: italic; letter-spacing: .12em; }
    #status-text { margin: 0; color: #18d3c5; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; }
    #progress { width: min(66vw, 360px); height: 4px; overflow: hidden; border: 0; border-radius: 4px; background: #233245; color: #18d3c5; }
    #progress::-webkit-progress-bar { background: #233245; }
    #progress::-webkit-progress-value { background: #18d3c5; }
    #progress::-moz-progress-bar { background: #18d3c5; }
    #status-error { display: none; max-width: min(80vw, 560px); margin: 0; color: #ff6b71; white-space: pre-wrap; }
    #retry { display: none; padding: 14px 24px; border: 1px solid #18d3c5; border-radius: 8px; background: #10232c; color: #f5f7fa; font-weight: 700; }
    #build-version { position: fixed; right: 8px; bottom: 8px; z-index: 5; color: #789; font-size: 10px; }
    #update { display: none; position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); z-index: 10; transform: translateX(-50%); padding: 12px 18px; border: 1px solid #18d3c5; border-radius: 8px; background: #10232c; color: white; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="canvas">Votre navigateur ne prend pas en charge Canvas.</canvas>
  </main>
  <div id="status" role="status" aria-live="polite">
    <h1 id="status-title">PADDOCK LEGACY</h1>
    <p id="status-text">Chargement…</p>
    <progress id="progress" max="1" value="0"></progress>
    <p id="status-error"></p>
    <button id="retry" type="button">RÉESSAYER</button>
  </div>
  <noscript>JavaScript doit être activé pour lancer Paddock Legacy.</noscript>
  <span id="build-version">BUILD __BUILD_SHORT_COMMIT__</span>
  <button id="update" type="button">NOUVELLE VERSION DISPONIBLE — METTRE À JOUR</button>
  <script src="$GODOT_URL"></script>
  <script>
    const engine = new Engine($GODOT_CONFIG);
    const status = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const statusError = document.getElementById('status-error');
    const progress = document.getElementById('progress');
    const retry = document.getElementById('retry');
    retry.addEventListener('click', () => window.location.reload());
    const loadedCommit = '__BUILD_COMMIT__';
    const update = document.getElementById('update');
    const rootUrl = new URL('../../', window.location.href);
    let deployedVersion = null;
    update.addEventListener('click', () => {
      if (!deployedVersion || !deployedVersion.short_commit) return;
      const destination = new URL(rootUrl.href);
      destination.searchParams.set('v', deployedVersion.short_commit);
      window.location.replace(destination.href);
    });
    function syncVisibleViewport() {
      const viewport = window.visualViewport;
      const height = viewport ? viewport.height : window.innerHeight;
      const offsetTop = viewport ? viewport.offsetTop : 0;
      document.documentElement.style.setProperty('--app-height', `${Math.round(height)}px`);
      document.documentElement.style.setProperty('--app-top', `${Math.round(offsetTop)}px`);
      window.scrollTo(0, 0);
    }
    syncVisibleViewport();
    window.addEventListener('resize', syncVisibleViewport, { passive: true });
    window.addEventListener('orientationchange', syncVisibleViewport, { passive: true });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncVisibleViewport, { passive: true });
      window.visualViewport.addEventListener('scroll', syncVisibleViewport, { passive: true });
    }
    async function checkVersion() {
      try {
        const versionUrl = new URL('build-version.json', rootUrl);
        versionUrl.searchParams.set('cache_bust', Date.now().toString());
        const response = await fetch(versionUrl, { cache: 'no-store' });
        if (!response.ok) return;
        const deployed = await response.json();
        deployedVersion = deployed;
        if (loadedCommit !== 'local' && deployed.commit && deployed.commit !== loadedCommit) update.style.display = 'block';
      } catch (error) { console.warn('Build version check unavailable', error); }
    }
    window.setInterval(checkVersion, 60000);
    checkVersion();

    engine.startGame({
      onProgress(current, total) {
        if (total > 0) progress.value = current / total;
      }
    }).then(() => {
      status.classList.add('hidden');
      window.setTimeout(() => status.remove(), 300);
    }).catch((error) => {
      progress.style.display = 'none';
      statusText.textContent = 'Le lancement a échoué';
      statusError.style.display = 'block';
      retry.style.display = 'inline-block';
      statusError.textContent = error instanceof Error ? error.message : String(error);
      console.error(error);
    });
  </script>
</body>
</html>
